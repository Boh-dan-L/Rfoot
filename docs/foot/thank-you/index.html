  <main class="thankyou">
    <div class="thankyou__box container">
      <h1 class="thankyou__title">🎉 Дякуємо за покупку!</h1>
      <p class="thankyou__text">
        Ваш доступ до курсу активовано.

  <footer class="footer">© Bogdan Rehab</footer>
  <script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var eventId = params.get("event_id");
  var orderRef = params.get("order_ref");
  var value = parseFloat(params.get("value")) || 0;
  var currency = params.get("currency") || "UAH";

  if (!eventId || !orderRef) return;

  // захист від повторного фаєру при F5
  var dedupKey = "meta_purchase_fired_" + orderRef;
  if (sessionStorage.getItem(dedupKey)) return;
  sessionStorage.setItem(dedupKey, "1");

  // пуш у dataLayer для GTM
  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({
    event: "meta_purchase",
    landing_id: window.APP_CONFIG?.landing_id || null,
    pixel_key: window.APP_CONFIG?.pixel_key || null,
    purchase: {
      event_id: eventId,
      order_ref: orderRef,
      value: value,
      currency: currency
    }
  });
})();
</script>
</body>
</html>
